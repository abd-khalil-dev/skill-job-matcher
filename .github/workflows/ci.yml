name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install -r backend/requirements.txt pytest pytest-cov
      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -v --cov=matcher --cov=app --cov-report=xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t backend:ci backend
      - name: Build frontend image
        run: docker build -t frontend:ci frontend
