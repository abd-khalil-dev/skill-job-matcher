name: oidc-debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show claims and variable checks
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          SECRET_ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "variable set: $([ -n "$ROLE" ] && echo yes || echo NO)"
          echo "secret with same name set: $([ -n "$SECRET_ROLE" ] && echo yes || echo no)"
          if echo "$ROLE" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/skill-job-matcher-github-actions$'; then echo "variable arn format: OK"; else echo "variable arn format: WRONG (length ${#ROLE})"; fi
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,json,base64; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); [print(k,'=',c.get(k)) for k in ('iss','aud','sub','repository','ref','event_name')]"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          retry-max-attempts: 1
