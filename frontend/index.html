<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill-to-Job Matcher</title>
<style>
body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
input { padding: 0.5rem; width: 70%; }
button { padding: 0.5rem 1rem; }
table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
th { background: #f0f0f0; }
#msg { color: #b00020; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Skill-to-Job Matcher</h1>
<p>Apni skills comma se alag likho (jaise: python, docker, sql)</p>
<input id="skills" placeholder="python, docker, sql">
<button id="go">Match</button>
<div id="msg"></div>
<table id="out" hidden>
<thead><tr><th>Job</th><th>Company</th><th>Match %</th><th>Missing skills</th></tr></thead>
<tbody></tbody>
</table>
<script>
const msg = document.getElementById("msg");
const out = document.getElementById("out");
const tbody = out.querySelector("tbody");

async function match() {
  msg.textContent = "";
  const skills = document.getElementById("skills").value
    .split(",").map(s => s.trim()).filter(Boolean);
  if (skills.length === 0) { msg.textContent = "Kam az kam ek skill likho"; return; }
  try {
    const res = await fetch("/api/match", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ skills })
    });
    if (!res.ok) throw new Error("Server error " + res.status);
    show(await res.json());
  } catch (e) {
    msg.textContent = "Error: " + e.message;
  }
}

function show(rows) {
  tbody.replaceChildren();
  for (const r of rows) {
    const tr = document.createElement("tr");
    for (const v of [r.title, r.company, r.match_percent + "%", r.missing_skills.join(", ") || "-"]) {
      const td = document.createElement("td");
      td.textContent = v;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  out.hidden = false;
}

document.getElementById("go").addEventListener("click", match);
</script>
</body>
</html>
